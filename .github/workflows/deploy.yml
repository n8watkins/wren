# Deploys main to the Cloudflare Worker (wrangler.jsonc) after CI passes on it,
# the same steps as a hand deploy (docs/DEPLOY.md): D1 migrations, then
# `npm run deploy`, then a check of the live /api/health.
# Only main deploys: release/* branches and pull requests never do.
name: Deploy

on:
  # Safe here: the job runs only for CI runs from pushes to main in this repo
  # (never pull requests or forks) and checks out the commit CI passed on.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    if: >-
      github.repository == 'n8watkins/wren' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Fails loudly: a missing token must never look like a successful deploy.
      - name: Check for the Cloudflare token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN repository secret is not set, so nothing was deployed."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID repository variable is not set, so nothing was deployed."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit CI passed on, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Migrations first, so new code never meets an old schema.
      - name: Apply D1 migrations
        run: npm run db:migrate

      - name: Build and deploy
        run: npm run deploy

      # /api/health answers 200 even when degraded, so read the JSON.
      - name: Smoke check the live site
        run: |
          for attempt in 1 2 3 4 5 6; do
            body=$(curl -sS --max-time 20 https://wren.n8builds.dev/api/health || true)
            status=$(printf '%s' "$body" | jq -r '.status // empty' 2>/dev/null || true)
            if [ "$status" = "ok" ]; then
              echo "Health is ok."
              exit 0
            fi
            echo "Attempt $attempt: status=${status:-unreadable}"
            sleep 15
          done
          echo "::error::https://wren.n8builds.dev/api/health did not report status ok after the deploy: $body"
          exit 1
